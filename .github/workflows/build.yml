name: Build

# Build and push only. Deploying is the infra repo's job (kat-e8/infra,
# playbooks/deploy-services.yml): it pins rosetta_chat_bridge_tag /
# rosetta_frontend_tag to one of the short-SHA tags pushed here, so a push to
# main never changes what's running anywhere by itself.
#
# Run it by hand (Actions > Build > Run workflow) to build a branch for
# staging before it's merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No real domain is written in this repo: the registry's name comes from
  # the repository variable REGISTRY_HOST (Settings > Secrets and variables >
  # Actions > Variables), which follows the infra repo's registry_host. Fail
  # if its domain turns up in the code, so a domain change never needs a
  # code change here.
  no-literal-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No literal domain
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          test -n "$REGISTRY_HOST" || { echo "Set the repository variable REGISTRY_HOST"; exit 1; }
          domain="${REGISTRY_HOST#registry.}"
          if git grep -nIiF "$domain" -- .; then
            echo "Literal '$domain' above: use \${REGISTRY} / example.com instead"; exit 1
          fi

  build:
    needs: no-literal-domain
    # Self-hosted runner on katmint, labelled "katmint". The registry is only
    # reachable on the tailnet, so GitHub-hosted runners can't push to it.
    # The runner's user holds a standing `docker login` for the registry
    # (repeat it when REGISTRY_HOST changes), so no registry credentials live
    # in GitHub.
    runs-on: [self-hosted, katmint]
    strategy:
      matrix:
        include:
          - service: chat-bridge
            context: ./chat-bridge
            dockerfile: chat-bridge/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    env:
      IMAGE: ${{ vars.REGISTRY_HOST }}/rosetta-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # Short SHA, the same form the infra repo already pins (e.g. eed114a).
      - name: Resolve tag
        id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t "$IMAGE:${{ steps.tag.outputs.short }}" \
            ${{ matrix.context }}

      - name: Push ${{ matrix.service }}
        run: docker push "$IMAGE:${{ steps.tag.outputs.short }}"

      # A moving "main" tag only for builds of main -- a branch built by hand
      # gets its SHA tag and nothing else, so it can't be mistaken for main.
      - name: Tag and push main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ steps.tag.outputs.short }}" "$IMAGE:main"
          docker push "$IMAGE:main"
