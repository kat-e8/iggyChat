name: Deploy

# Deploy only, and only on a tag push -- build.yml is what actually builds
# and pushes images (on every push to main). A tag marks "deploy the
# already-built image for this commit"; nothing is rebuilt here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (defaults to the tagged commit). Use this for a rollback.'
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, iggychat]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target SHA
        id: resolve
        run: |
          SHA="${{ github.event.inputs.sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Stage secrets
        # Real .env files live outside the repo/workspace on clubuntu --
        # never committed, never a GitHub secret. See Phase 5 report.
        # No gateway.env -- this project doesn't run its own gateway
        # anymore (see Deployment/Phase10_*.pdf).
        run: |
          cp ~/.config/iggychat/chat-bridge.env chat-bridge/.env

      - name: Pull pinned images
        run: TAG="${{ steps.resolve.outputs.sha }}" docker compose pull

      - name: Deploy
        run: TAG="${{ steps.resolve.outputs.sha }}" docker compose up -d --remove-orphans

      - name: Smoke test
        # Retries for up to 60s instead of a single fixed sleep -- a fresh
        # container (chat-bridge's FastAPI startup, frontend's own
        # healthcheck) can take a few seconds longer than a flat sleep
        # accounts for, which cost this step a false-negative failure on
        # its first real run even though the deploy itself had succeeded.
        run: |
          for url in http://localhost:8090/ http://localhost:8001/docs; do
            for i in $(seq 1 12); do
              if curl -sf "$url" >/dev/null; then
                echo "OK: $url"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "FAILED: $url never came up"
                exit 1
              fi
              sleep 5
            done
          done
          echo "Smoke test passed for SHA ${{ steps.resolve.outputs.sha }}"
