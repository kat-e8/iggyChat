@if (awaiting()) {
  <div class="status" aria-live="polite">
    <img
      ngSrc="images/loading-indicator.gif"
      width="72"
      height="72"
      priority
      alt=""
      class="spinner"
    />
    @if (activeToolCall(); as toolCall) {
      <p class="status-text">Calling <code>{{ toolCall.name }}</code>…</p>
    } @else {
      <p class="status-text">It can take up to 20 seconds to get a reply.</p>
      <p class="status-timer"><strong>{{ elapsedSeconds() }}</strong> seconds ...</p>
    }
  </div>
}
