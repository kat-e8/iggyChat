<div class="page">
  <aside class="sidebar" [class.expanded]="!sidebarCollapsed()">
    <div class="sidebar-top">
      <button type="button" class="icon-button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="9" y1="4" x2="9" y2="20" />
        </svg>
      </button>
      <img
        ngSrc="images/rosetta-mark.svg"
        width="500"
        height="500"
        alt="Rosetta"
        class="brand-icon"
      />
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item" (click)="startNewChat()" aria-label="New Chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 20h9" stroke-linecap="round" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="nav-label">New Chat</span>
      </button>
    </nav>

    <button type="button" class="nav-item logout" (click)="logout()" aria-label="Log out">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="nav-label">Log out</span>
    </button>
  </aside>

  <main class="content">
    <div class="scope-bar">
      <chat-scope-select [scope]="chat.scope()" (scopeChosen)="onScopeChosen($event)" />
    </div>

    @if (chat.connectionError(); as connectionError) {
      <p class="connection-error" role="alert">{{ connectionError }}</p>
    }

    @if (!hasMessages()) {
      <div class="empty-state">
        <img
          ngSrc="images/rosetta-logo.svg"
          width="500"
          height="500"
          priority
          alt="Rosetta -- Translate, Transform, Empower"
          class="brand-logo"
        />
        <chat-input [disabled]="chat.awaitingReply()" (submitPrompt)="onSubmitPrompt($event)" />
      </div>
    } @else {
      <div class="conversation">
        <div class="transcript" #transcript>
          <chat-message-list [messages]="chat.messages()" />
          <chat-status [awaiting]="chat.awaitingReply()" [currentMessage]="currentAssistantMessage()" />
        </div>
        <div class="composer">
          <chat-input [disabled]="chat.awaitingReply()" (submitPrompt)="onSubmitPrompt($event)" />
        </div>
      </div>
    }
  </main>
</div>
