<form [formRoot]="draftForm" (submit)="onSubmit()" class="chat-input">
  <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="11" cy="11" r="7" />
    <path d="m21 21-4.3-4.3" stroke-linecap="round" />
  </svg>

  <label class="visually-hidden" for="chat-prompt">Message</label>
  <input
    id="chat-prompt"
    type="text"
    [placeholder]="placeholder()"
    autocomplete="off"
    [formField]="draftForm.prompt"
  />

  <button type="submit" class="send-button" [disabled]="disabled()" aria-label="Send message">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</form>
