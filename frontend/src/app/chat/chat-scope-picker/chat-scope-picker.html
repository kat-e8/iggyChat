<div class="scope-picker">
  <p class="scope-picker-label">What should this conversation be able to access?</p>

  <div class="scope-options" role="radiogroup" aria-label="Conversation scope">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="selected() === option.value"
        class="scope-option"
        [class.selected]="selected() === option.value"
        (click)="select(option.value)"
      >
        <span class="scope-option-label">{{ option.label }}</span>
        <span class="scope-option-description">{{ option.description }}</span>
      </button>
    }
  </div>

  <button type="button" class="scope-confirm" (click)="confirm()">Start chat</button>
</div>
