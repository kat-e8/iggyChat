<label class="visually-hidden" [for]="fieldId()">{{ label() }}</label>
<input
  #passwordInput
  [id]="fieldId()"
  [type]="inputType()"
  [value]="value()"
  (input)="value.set(passwordInput.value)"
  (blur)="touch.emit()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [class.invalid]="showInvalid()"
  [attr.aria-invalid]="showInvalid()"
/>
<button
  type="button"
  class="visibility-toggle"
  [attr.aria-label]="toggleLabel()"
  [attr.aria-pressed]="visible()"
  (click)="toggleVisible()"
>
  @if (visible()) {
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M1 12s4-7 11-7c2 0 3.7.6 5.1 1.4M23 12s-4 7-11 7c-2 0-3.7-.6-5.1-1.4M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  }
</button>
