<div class="auth-page">
  <div class="brand-pane">
    <img
      ngSrc="images/rosetta-logo.png"
      width="640"
      height="625"
      priority
      alt="Rosetta -- Translate, Transform, Empower"
      class="brand-logo"
    />
  </div>

  <div class="auth-card">
    <img
      ngSrc="images/rosetta-mark.png"
      width="320"
      height="371"
      priority
      alt="Rosetta"
      class="brand-mark"
    />

    <h2>{{ heading() }}</h2>

    <ng-content />

    <p class="auth-card-footer">
      <ng-content select="[footer]" />
    </p>
  </div>
</div>
