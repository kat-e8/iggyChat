[project]
name = "gateway"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kat-e8", email = "katlego.gagoopane@element8.co.za" }
]
requires-python = ">=3.12"
dependencies = [
    "docker-mcp",
    "fastapi>=0.141.1",
    "ignition-mcp",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
gateway = "gateway:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
docker-mcp = { path = "../docker-mcp", editable = true }
ignition-mcp = { path = "../ignition-mcp", editable = true }
