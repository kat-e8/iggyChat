services:
  gateway:
    build:
      context: ..
      dockerfile: mcp-gateway/Dockerfile
    # No published port -- only chat-bridge (below) is reachable from outside
    # this compose network. The Gateway is internal-only, per the BFF
    # architecture (see ../../chat-bridge/ARCHITECTURE.md): the browser only
    # ever talks to the Chat Bridge, which holds the Gateway's X-API-Key
    # server-side and reaches it at http://gateway:8000 via compose's own
    # service-name DNS.
    expose:
      - "8000"
    env_file:
      - .env
    container_name: mcp-gateway
    environment:
      # Bind address is a container-topology concern, not a secret -- set it
      # here rather than in .env, so a host-testing .env (GATEWAY_HOST=127.0.0.1)
      # can't silently make the container unreachable on the compose network.
      # `environment:` takes precedence over `env_file:` in compose.
      - GATEWAY_HOST=0.0.0.0
    volumes:
      # Docker-outside-of-Docker: lets docker-mcp's `docker` CLI control the
      # HOST's Docker daemon from inside this container. This is effectively
      # root on the host -- anyone who can reach /docker on this gateway can
      # create/mount arbitrary containers. The GATEWAY_API_KEY middleware is
      # the only thing standing between the chat-bridge network and that, so
      # treat the key like a root credential.
      - /var/run/docker.sock:/var/run/docker.sock
   # restart: unless-stopped

  chat-bridge:
    build:
      # Spans chat-bridge/ (sibling to backend/), not this repo -- see
      # ../../chat-bridge/Dockerfile for how to also bake the built Angular
      # app in before running `docker compose up`.
      context: ../../chat-bridge
      dockerfile: Dockerfile
    # The only service this compose file publishes to the host -- the single
    # public entry point the browser talks to.
    ports:
      - "8001:8001"
    env_file:
      - ../../chat-bridge/.env
    container_name: chat-bridge
    environment:
      - CHAT_BRIDGE_HOST=0.0.0.0
      # Container-topology concern, same reasoning as GATEWAY_HOST above:
      # reach the Gateway by its compose service name, not localhost/127.0.0.1.
      - GATEWAY_URL=http://gateway:8000
      # claude-agent-sdk reads this directly from the process environment,
      # not from .env -- passed through from the shell that runs
      # `docker compose up`; unset if using a logged-in `claude` CLI baked
      # into the image instead.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - gateway
 #   restart: unless-stopped

  frontend:
    build:
      # Spans frontend/ (sibling to backend/), not this repo -- see
      # ../../frontend/Dockerfile. Builds the Angular app and serves it via
      # nginx, which also reverse-proxies /api/* to chat-bridge on the shared
      # compose network (see ../../frontend/nginx.conf).
      context: ../../frontend
      dockerfile: Dockerfile
    # Second host-published service, alongside chat-bridge -- the browser
    # talks to this nginx for the app shell and static assets; nginx forwards
    # /api/* to chat-bridge:8001 via compose service-name DNS.
    ports:
      - "8080:80"
    container_name: mcp-frontend
    volumes:
      - ../../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - chat-bridge
 #   restart: unless-stopped

volumes:
  nginx-logs:
