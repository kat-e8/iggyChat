# Explicit project name so container/network/volume names are predictable
# regardless of which directory this is checked out into or run from.
name: iggychat

services:
  chat-bridge:
    build:
      # See chat-bridge/Dockerfile for how to also bake the built Angular
      # app in before running `docker compose up`.
      context: ./chat-bridge
      dockerfile: Dockerfile
    image: clubuntu.dala-cirius.ts.net:5000/iggychat-chat-bridge:${TAG:-dev}
    # The only service this compose file publishes to the host -- the single
    # public entry point the browser talks to.
    ports:
      - "8001:8001"
    env_file:
      - ./chat-bridge/.env
    container_name: iggychat-chat-bridge
    environment:
      - CHAT_BRIDGE_HOST=0.0.0.0
      # Not this project's own gateway -- a shared MCP gateway already
      # running on this host for other tools. See Deployment/Phase10_*.pdf.
      - IGNITION_MCP_URL=http://clubuntu.dala-cirius.ts.net:8000/ignition/mcp
      # SQLite usage-tracking DB lives on the named volume below, not the
      # container's own writable layer -- must survive `docker compose up`
      # recreating the container on every deploy, since its whole purpose is
      # tracking cumulative spend over days/weeks.
      - CHAT_BRIDGE_USAGE_DB_PATH=/data/usage.db
      # Same reasoning, separate file: permanent user accounts (see
      # Deployment/Phase8_*.pdf) must survive redeploys too, on the same
      # persistent volume as usage.db.
      - CHAT_BRIDGE_USERS_DB_PATH=/data/users.db
    volumes:
      - chat-bridge-data:/data
 #   restart: unless-stopped

  frontend:
    build:
      # Builds the Angular app and serves it via nginx, which also
      # reverse-proxies /api/* to chat-bridge on the shared compose network
      # (see frontend/nginx.conf).
      context: ./frontend
      dockerfile: Dockerfile
    image: clubuntu.dala-cirius.ts.net:5000/iggychat-frontend:${TAG:-dev}
    # Second host-published service, alongside chat-bridge -- the browser
    # talks to this nginx for the app shell and static assets; nginx forwards
    # /api/* to chat-bridge:8001 via compose service-name DNS.
    # Port 8080 is already taken by an unrelated service on the shared
    # clubuntu host (filebrowser) -- published on 8090 instead.
    ports:
      - "8090:80"
    container_name: iggychat-frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - chat-bridge
 #   restart: unless-stopped

volumes:
  nginx-logs:
  chat-bridge-data:
