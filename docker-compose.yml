# Explicit project name so container/network/volume names are predictable
# regardless of which directory this is checked out into or run from.
#
# Deliberately left as "iggychat", not renamed to "rosetta" alongside the
# rest of the project's rebrand -- Compose derives the actual named volumes
# below (chat-bridge-data, holding real user accounts + usage history) from
# this project name when they have no explicit `name:` override, which
# neither does. Changing this to "rosetta" would make the next deploy
# silently attach to a brand-new empty volume instead of the real one -- not
# data loss, but data becoming invisible without any error. Safe to rename
# once (and only once) that volume has been migrated to a "rosetta_*" name
# on clubuntu first (`docker volume create` + copy via a throwaway
# container), which is a one-time host-side step, not something to change
# here casually.
name: iggychat

services:
  chat-bridge:
    build:
      # See chat-bridge/Dockerfile for how to also bake the built Angular
      # app in before running `docker compose up`.
      context: ./chat-bridge
      dockerfile: Dockerfile
    image: clubuntu.dala-cirius.ts.net:5000/rosetta-chat-bridge:${TAG:-dev}
    # The only service this compose file publishes to the host -- the single
    # public entry point the browser talks to.
    ports:
      - "8001:8001"
    env_file:
      - ./chat-bridge/.env
    container_name: rosetta-chat-bridge
    environment:
      - CHAT_BRIDGE_HOST=0.0.0.0
      # Not this project's own gateway -- a shared MCP gateway already
      # running on this host for other tools. See Deployment/Phase10_*.pdf.
      - IGNITION_MCP_URL=http://clubuntu.dala-cirius.ts.net:8000/ignition/mcp
      # SQLite usage-tracking DB lives on the named volume below, not the
      # container's own writable layer -- must survive `docker compose up`
      # recreating the container on every deploy, since its whole purpose is
      # tracking cumulative spend over days/weeks.
      - CHAT_BRIDGE_USAGE_DB_PATH=/data/usage.db
      # Same reasoning, separate file: permanent user accounts (see
      # Deployment/Phase8_*.pdf) must survive redeploys too, on the same
      # persistent volume as usage.db.
      - CHAT_BRIDGE_USERS_DB_PATH=/data/users.db
    volumes:
      - chat-bridge-data:/data
 #   restart: unless-stopped

  frontend:
    build:
      # Builds the Angular app and serves it via nginx, which also
      # reverse-proxies /api/* to chat-bridge on the shared compose network
      # (see frontend/nginx.conf).
      context: ./frontend
      dockerfile: Dockerfile
    image: clubuntu.dala-cirius.ts.net:5000/rosetta-frontend:${TAG:-dev}
    # Second host-published service, alongside chat-bridge -- the browser
    # talks to this nginx for the app shell and static assets; nginx forwards
    # /api/* to chat-bridge:8001 via compose service-name DNS.
    # Port 8080 is already taken by an unrelated service on the shared
    # clubuntu host (filebrowser) -- published on 8090 instead.
    ports:
      - "8090:80"
    container_name: rosetta-frontend
    # tsdproxy picks this container up and fronts it with a Tailscale-network
    # identity, same pattern as ManPage's gateway service -- gives it a
    # tailnet hostname/HTTPS endpoint gated by tailnet auth, alongside (not
    # instead of) the plain :8090 publish above.
    labels:
      tsdproxy.enable: "true"
      tsdproxy.ephemeral: "false"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - chat-bridge
 #   restart: unless-stopped

volumes:
  nginx-logs:
  chat-bridge-data:
